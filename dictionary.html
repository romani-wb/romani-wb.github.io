<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roman Dictionary</title>
    <meta name="description" content="Search 12,525 Roman dictionary entries in two Roman spellings with German and English meanings.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="dictionary.css">
  </head>
  <body>
    <a class="skip-link" href="#search-input">Skip to dictionary search</a>

    <header class="dictionary-header">
      <a class="dictionary-brand" href="index.html" aria-label="Roman story home">
        <span>Roman</span>
        <small>Dictionary</small>
      </a>
      <nav class="dictionary-nav" aria-label="Primary navigation">
        <a href="index.html">Story</a>
        <a class="active" href="dictionary.html" aria-current="page">Dictionary</a>
        <a href="word-list.html">Word list</a>
        <a href="grammar.html">Grammar</a>
        <a href="explore.html">Explore</a>
      </nav>
      <div class="header-controls" aria-label="Display controls">
        <label class="edition-select" for="edition-select">
          <span>Layout</span>
          <select id="edition-select">
            <option value="learner">Focus</option>
            <option value="compact" selected>Browse</option>
            <option value="explorer">Split</option>
          </select>
        </label>
        <fieldset class="compact-toggle">
          <legend>Spelling</legend>
          <button type="button" class="active" data-spelling="int" aria-pressed="true">INT</button>
          <button type="button" data-spelling="deu" aria-pressed="false">DEU</button>
        </fieldset>
        <fieldset class="compact-toggle">
          <legend>Meaning</legend>
          <button type="button" class="active" data-language="de" aria-pressed="true">DE</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </fieldset>
      </div>
    </header>

    <main class="dictionary-shell">
      <aside class="search-pane" aria-label="Dictionary search">
        <div class="search-head">
          <div>
            <p class="section-label">Roman · Deutsch · English</p>
            <h1>Find a word</h1>
          </div>
        </div>
        <div class="search-command">
          <label class="search-box" for="search-input">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Roman word, German or English meaning" aria-describedby="result-meta">
          </label>
          <button class="random-entry" id="random-entry" type="button" title="Open a random entry"><span class="surprise-icon" aria-hidden="true">✦</span><span>Surprise me</span></button>
        </div>
        <nav class="word-class-filters" id="word-class-filters" aria-label="Browse by word type"></nav>
        <div class="result-meta" id="result-meta" role="status" aria-live="polite"></div>
        <div class="results" id="results"></div>
        <p class="data-status" id="data-status" role="status" aria-live="polite">Loading dictionary data…</p>
      </aside>

      <section class="entry-pane" id="entry-pane" aria-live="polite">
        <div class="empty-state">
          <p class="section-label">Dictionary entry</p>
          <h2>Select a word</h2>
          <p>Search a word or meaning, browse by word type, or use Surprise me.</p>
        </div>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
