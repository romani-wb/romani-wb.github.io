<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Romani WB</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Romani WB</h1>
          <p id="data-status">Loading dictionary data...</p>
        </div>
        <div class="controls" aria-label="Display controls">
          <fieldset class="segmented">
            <legend>Spelling</legend>
            <button type="button" class="active" data-spelling="int">INT</button>
            <button type="button" data-spelling="deu">DEU</button>
          </fieldset>
          <fieldset class="segmented">
            <legend>Meanings</legend>
            <button type="button" class="active" data-language="de">DE</button>
            <button type="button" data-language="en">EN</button>
          </fieldset>
        </div>
      </header>

      <main class="workspace">
        <section class="search-pane" aria-label="Dictionary search">
          <div class="search-wrap">
            <label for="search-input">Search</label>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Roman, German, English">
          </div>
          <div class="result-meta" id="result-meta"></div>
          <ol class="results" id="results"></ol>
        </section>

        <section class="entry-pane" id="entry-pane" aria-live="polite">
          <div class="empty-state">
            <h2>Select an entry</h2>
            <p>Search results will appear on the left.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
