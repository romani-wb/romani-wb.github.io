<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roman Wörterbuch</title>
    <meta name="description" content="The alphabetical Roman inventory is now part of the main dictionary.">
    <link rel="icon" href="data:,">
    <meta http-equiv="refresh" content="0; url=dictionary.html#dictionary-index">
    <style>
      @font-face {
        font-family: "BDO Grotesk";
        src: url("assets/romani-project/fonts/BDOGrotesk-Regular.otf") format("opentype");
        font-display: swap;
        font-weight: 400;
      }

      @font-face {
        font-family: "BDO Grotesk";
        src: url("assets/romani-project/fonts/BDOGrotesk-DemiBold.otf") format("opentype");
        font-display: swap;
        font-weight: 600;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: "BDO Grotesk", Arial, sans-serif;
      }

      main {
        width: min(640px, calc(100% - 40px));
        margin: 18vh auto 0;
        padding-top: 24px;
        border-top: 1px solid #000000;
      }

      h1 {
        margin: 0;
        font-size: 56px;
        font-weight: 400;
        line-height: 1;
      }

      p {
        margin: 16px 0 0;
        color: #5f5f5f;
        font-size: 18px;
        line-height: 1.45;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        color: #1b68d2;
        font-weight: 600;
        text-underline-offset: 4px;
      }

      @media (max-width: 620px) {
        h1 { font-size: 38px; }
        p { font-size: 16px; }
      }
    </style>
    <script>
      const target = new URL("dictionary.html", window.location.href);
      const params = new URLSearchParams(window.location.search);
      for (const [key, value] of params) target.searchParams.set(key, value);
      target.searchParams.set("edition", "compact");
      target.hash = "dictionary-index";
      window.location.replace(`${target.pathname.split("/").pop()}${target.search}${target.hash}`);
    </script>
  </head>
  <body>
    <main>
      <h1>Roman Wörterbuch</h1>
      <p>Der alphabetische Bestand ist jetzt Teil des Wörterbuchs.</p>
      <a href="dictionary.html#dictionary-index">Wörterbuch öffnen</a>
    </main>
  </body>
</html>
