name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir -p _site/data/processed/entries
          mkdir -p _site/assets
          cp index.html dictionary.html word-list.html grammar.html explore.html imprint.html _site/
          cp styles.css dictionary.css reference.css explore.css site-footer.css _site/
          cp app.js word-types.js explore.js site-i18n.js _site/
          cp -R assets/romani-project _site/assets/
          cp data/processed/entries_manifest.json _site/data/processed/
          cp data/processed/entries_search.json _site/data/processed/
          cp data/processed/references.json _site/data/processed/
          cp data/processed/paradigm_model.json _site/data/processed/
          cp data/processed/entries/*.json _site/data/processed/entries/
          touch _site/.nojekyll

      - name: Verify public artifact
        run: |
          test -f _site/index.html
          test -f _site/imprint.html
          test -f _site/site-i18n.js
          test -f _site/assets/romani-project/RP_Logo.svg
          test -f _site/assets/romani-project/BKA_Logo_deu.svg
          test -f _site/data/processed/entries_search.json
          test -f _site/data/processed/entries/entries-025.json
          test ! -e _site/roman-wb-valentin
          test ! -e _site/backups

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
